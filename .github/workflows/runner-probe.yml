name: runner probe

on:
  workflow_dispatch:
  push:
    branches:
      - feat/web-import-clean
    paths:
      - .github/workflows/runner-probe.yml

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-13, macos-14, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Report the runner
        run: uname -a && echo "${{ matrix.os }}"
